name: Publish to PyPI and GitHub
# Pushing a tag v<version> publishes that version. The tag must match the
# version in pyproject.toml; tag the commit that the release deploys.
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  publish:
    name: Build, publish to PyPI and create a GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Check the tag matches the package version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish -t ${{ secrets.PYPI_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=""
          if echo "${VERSION}" | grep -q '[a-z]'; then flags="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag ${flags}
