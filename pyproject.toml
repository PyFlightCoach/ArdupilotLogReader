[project]
name = "ardupilot_log_reader"
version = "0.4.0"
description = "module to read ardupilot binary logs to memory"
readme = "README.md"
authors = [{ name = "Thomas David", email = "thomasdavid0@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1.3",
    "pandas>=2.2.3",
]


[project.optional-dependencies]
pymavlink = ["pymavlink>=2.4.42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3.3"]
lint = ["ruff>=0.7.3"]

[tool.hatch.build.targets.sdist]
# The test logs and the pymavlink field dump are well over PyPI's 100 MB file limit.
exclude = ["tests/test_inputs", "pymavlink_bin_fields.json"]
